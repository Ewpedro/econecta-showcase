name: holerite_app
description: Consulta e acompanhamento automático de holerites - Questor Público
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.3
  pretty_dio_logger: ^1.3.1
  provider: ^6.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  flutter_secure_storage: ^9.0.0
  flutter_pdfview: ^1.3.2
  open_filex: ^4.5.0
  flutter_local_notifications: ^17.1.2
  workmanager: ^0.5.2
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  animations: ^2.0.11
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.3
  badges: ^3.1.2
  intl: ^0.19.0
  share_plus: ^9.0.0
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.3
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/
